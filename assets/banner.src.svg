<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 450" width="1290" height="450" role="img" aria-label="Alessio D'Aleo. Builder. I don't sell ideas I haven't built.">
  <style>
    @font-face { font-family: 'B'; font-weight: 800; src: url(data:font/ttf;base64,{{BRICOLAGE}}) format('truetype'); }
    @font-face { font-family: 'P'; font-weight: 500; src: url(data:font/ttf;base64,{{PLEX}}) format('truetype'); }
    @font-face { font-family: 'M'; font-weight: 500; src: url(data:font/ttf;base64,{{MONO}}) format('truetype'); }
    @font-face { font-family: 'M'; font-weight: 700; src: url(data:font/ttf;base64,{{MONOBOLD}}) format('truetype'); }
    .b { font-family: 'B', 'Arial Black', sans-serif; font-weight: 800; }
    .p { font-family: 'P', 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; }
    .m { font-family: 'M', Consolas, Menlo, monospace; font-weight: 500; }
    .mb { font-family: 'M', Consolas, Menlo, monospace; font-weight: 700; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 161px 84px; }
    @keyframes pulse { 50% { transform: scale(.6); opacity: .5 } }
    @media (prefers-reduced-motion: reduce) { .cur, .dot { animation: none } }
  </style>

  <!-- card with hard offset shadow -->
  <rect x="10" y="10" width="1278" height="438" rx="32" fill="#0E0F13"/>
  <rect x="2" y="2" width="1276" height="436" rx="32" fill="#F6F2E7" stroke="#0E0F13" stroke-width="3"/>

  <!-- mark: A + bolt -->
  <g transform="translate(64 56) scale(.5)">
    <rect width="120" height="120" rx="28" fill="#0F5FCC"/>
    <path d="M38 94 L57 28" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <path d="M82 94 L63 28" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M71 38 L45 70 L60 70 L51 94 L81 60 L65 60 L74 38 Z" fill="#E8F04B"/>
  </g>

  <!-- availability pill -->
  <rect x="140" y="62" width="262" height="44" rx="22" fill="#FFFFFF" stroke="#0E0F13" stroke-width="2"/>
  <circle class="dot" cx="161" cy="84" r="7" fill="#E7302F"/>
  <text class="mb" x="178" y="90" font-size="16" fill="#0E0F13" letter-spacing="1.2">OPEN FOR NEW BUILDS</text>

  <!-- name + headline -->
  <text class="p" x="64" y="176" font-size="28" fill="#0E0F13" fill-opacity=".72">Alessio D'Aleo</text>
  <rect x="58" y="252" width="{{HL_W}}" height="46" rx="6" fill="#E8F04B"/>
  <text class="b" x="60" y="290" font-size="140" fill="#0E0F13" letter-spacing="-5">Builder<tspan fill="#E7302F">.</tspan></text>
  <text class="p" x="64" y="350" font-size="27" fill="#0E0F13">I don't sell ideas I haven't built.</text>
  <text class="m" x="64" y="396" font-size="17" fill="#0F5FCC" letter-spacing=".4">AI agents  ·  acquisition engines  ·  apps  ·  automations</text>

  <!-- build log terminal -->
  <rect x="770" y="58" width="456" height="330" rx="20" fill="#0F5FCC"/>
  <rect x="762" y="50" width="456" height="330" rx="20" fill="#0E0F13"/>
  <circle cx="792" cy="80" r="7" fill="#E7302F"/>
  <circle cx="814" cy="80" r="7" fill="#E8F04B"/>
  <circle cx="836" cy="80" r="7" fill="#0F5FCC"/>
  <text class="m" x="1192" y="86" font-size="15" fill="#F6F2E7" fill-opacity=".45" text-anchor="end">~/builds</text>
  <line x1="762" y1="104" x2="1218" y2="104" stroke="#F6F2E7" stroke-opacity=".12" stroke-width="1.5"/>

  <g font-size="19">
    <text class="m ln l1" x="790" y="146"><tspan fill="#E8F04B">$</tspan><tspan fill="#F6F2E7"> ship --with claude-code</tspan></text>
    <g class="ln l2"><text class="mb" x="790" y="188" fill="#E8F04B">✓</text><text class="m" x="818" y="188" fill="#F6F2E7">studio-os</text><text class="m" x="1192" y="188" fill="#F6F2E7" fill-opacity=".5" text-anchor="end">live</text></g>
    <g class="ln l3"><text class="mb" x="790" y="226" fill="#E8F04B">✓</text><text class="m" x="818" y="226" fill="#F6F2E7">agent-team</text><text class="m" x="1192" y="226" fill="#F6F2E7" fill-opacity=".5" text-anchor="end">running</text></g>
    <g class="ln l4"><text class="mb" x="790" y="264" fill="#E8F04B">✓</text><text class="m" x="818" y="264" fill="#F6F2E7">team-di-agenti</text><text class="m" x="1192" y="264" fill="#F6F2E7" fill-opacity=".5" text-anchor="end">v1.0 public</text></g>
    <g class="ln l5"><text class="mb" x="790" y="302" fill="#E8F04B">✓</text><text class="m" x="818" y="302" fill="#F6F2E7">snail</text><text class="m" x="1192" y="302" fill="#F6F2E7" fill-opacity=".5" text-anchor="end">beta</text></g>
    <g class="ln l6"><text class="mb" x="790" y="348" fill="#E7302F">→</text><text class="m" x="818" y="348" fill="#F6F2E7">next: your build</text><rect class="cur" x="1002" y="332" width="11" height="21" fill="#E8F04B"/></g>
  </g>
</svg>

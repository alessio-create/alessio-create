name: card
on:
  schedule: [{ cron: "30 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python card/today.py
        env: { GH_TOKEN: "${{ secrets.ACCESS_TOKEN }}" }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/*.svg
          git diff --cached --quiet || (git commit -m "Update profile card" && git push)
